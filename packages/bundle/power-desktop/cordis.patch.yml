# The dsh-power-desktop bundle patch: a fail-closed layer applied after
# dsh-base and dsh-web-app. Later user/profile overlays still win by design,
# so the assembled-config test pins every security-relevant row this layer owns.

# No session content leaves through telemetry, external Web retrieval, or the
# first-prompt title model. The deterministic local title fallback remains.
- id: session-telemetry-otel
  disabled: true

- id: session-title-llm
  disabled: true

- id: web
  disabled: true

- id: web-search-deepseek
  disabled: true

- id: tool-web
  disabled: true

# Native-only presentation plus explicit denial of every generic command path.
# The sandbox/subprocess Services remain mounted: fixed ripgrep discovery and
# the Esafenet bridge use constrained provider APIs, never a model command tool.
- id: tools
  config:
    mode: native

- id: code-runtime
  disabled: true

# These are generic command executors, not the process-confinement `sandbox`
# service used by fs-esafenet. Power presets need neither executor.
- id: bash-sandbox
  disabled: true

- id: pwsh-sandbox
  disabled: true

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-str-replace-editor
  disabled: true

# Permission is selected only by the shipped power preset. Removing the host
# switch prevents a session event from overriding review=read-only or
# fix=workspace-write. One-shot escalation is also rejected deterministically.
- id: permission
  disabled: true

- id: ui-permission
  disabled: true

- id: approval
  config:
    policy: never

# The host fallback is read-only. Each power preset mounts an isolated policy
# beside tool-fs: review stays read-only and fix resolves workspace-write. The
# base sandbox Service Provider remains enabled and is required by fs-esafenet.
- id: sandbox-policy
  config:
    mode: read-only
    workspaceRoot: !!js process.cwd()

# Replace the ordinary filesystem provider without changing the sandbox or
# observation-policy rows. The protected-content bridge accepts only its fixed
# operation protocol and executes through the mounted sandbox provider.
- id: fs-sandbox
  disabled: true

- insert:
    - id: fs-esafenet
      name: '@deepseek-ai/dsh-fs-esafenet'
      config:
        cwd: !!js process.cwd()
        diffBasisMaxBytes: 10485760
        operationTimeoutMs: 30000
        maxTextBytes: 16777216

# The power workbench starts every new session on the stricter review preset.
- id: agent-presets
  config:
    default: power-review
    allowedIds:
      - power-review
      - power-fix
    includeUserRoot: false
