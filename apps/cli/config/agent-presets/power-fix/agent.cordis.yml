# The bounded power-software source-fix preset. The host owns registries,
# persistence, the model route, the Esafenet filesystem provider, the process
# sandbox provider, and approval. This preset adds no arbitrary process, Web,
# terminal, target-board, or physical-actuation capability.

- id: power-prompt
  name: '@deepseek-ai/dsh-power-prompt'
  config:
    sourceAccess: powershell-fixed
    sourceMutation: task-scoped
    # P0 exposes no arbitrary command runner or specialized build receipt tool.
    verification: static-only

- id: power-policy
  name: '@deepseek-ai/dsh-power-policy'
  config:
    mode: fix

- id: power-analysis
  name: '@deepseek-ai/dsh-power-analysis'
  config:
    mode: fix

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# The sandbox policy is preset-owned so selecting fix admits writes only under
# the session workspace. It shares one entry-local realm with tool-fs, which
# passes the resolved policy to the host Esafenet provider and sandbox runner.
- id: filesystem-authority
  name: cordis:group
  group: true
  isolate:
    sandboxPolicy: true
  config:
    - id: power-fix-sandbox-policy
      name: '@deepseek-ai/dsh-sandbox-policy'
      config:
        mode: workspace-write
        workspaceRoot: !!js process.cwd()

    - id: tool-fs
      name: '@deepseek-ai/dsh-tool-fs'
      inject: [sandboxPolicy]

# Search uses packaged ripgrep with fixed argv through ctx.subprocess. It is
# discovery, not a general process or shell surface.
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false
